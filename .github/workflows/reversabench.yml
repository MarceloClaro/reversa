name: ReversaBench experimental harness

on:
  push:
    paths:
      - 'benchmarks/reversabench/**'
      - 'lib/integrations/software-engineering/experimental-harness.js'
      - 'scripts/run-reversabench-smoke.mjs'
      - 'scripts/render-reversabench-report.mjs'
      - 'scripts/test-reversabench-experimental-harness.mjs'
      - 'specs/SPEC-REVERSABENCH-EXPERIMENTAL-HARNESS-V1.md'
      - 'paper/**'
      - '.github/workflows/reversabench.yml'
  pull_request:
    paths:
      - 'benchmarks/reversabench/**'
      - 'lib/integrations/software-engineering/experimental-harness.js'
      - 'scripts/run-reversabench-smoke.mjs'
      - 'scripts/render-reversabench-report.mjs'
      - 'scripts/test-reversabench-experimental-harness.mjs'
      - 'specs/SPEC-REVERSABENCH-EXPERIMENTAL-HARNESS-V1.md'
      - 'paper/**'
      - '.github/workflows/reversabench.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test experimental harness
        run: node scripts/test-reversabench-experimental-harness.mjs
      - name: Generate engineering smoke report
        run: npm run bench:smoke:paper
      - name: Assert smoke cannot become confirmatory
        run: |
          node -e "const r=require('./.reversa-bench/smoke-report.json'); if(r.confirmatory_attempt.confirmatory!==false) process.exit(1); if(r.scientific_result!==false) process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: reversabench-smoke-artifacts
          path: |
            .reversa-bench/smoke-report.json
            paper/generated/reversabench-smoke.tex
