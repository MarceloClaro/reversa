name: Verify invocation axis

# Gates executáveis de invocação e rigor Feynman.
# Garante lockstep user/model-invoked, metadados OpenAI, transporte pelo installer
# e presença dos Feynman Evidence & Understanding Gates nos agentes críticos.

on:
  push:
    paths:
      - 'agents/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-installer-transport.mjs'
      - 'package.json'
      - '.github/workflows/verify-invocation.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-installer-transport.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar eixo de invocação
        run: python3 scripts/verify-invocation.py
      - name: Verificar Feynman Evidence & Understanding Layer
        run: python3 scripts/verify-feynman-layer.py
      - name: Smoke test de transporte do installer
        run: node scripts/test-installer-transport.mjs
