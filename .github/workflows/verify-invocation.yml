name: Verify invocation axis

# Gates executáveis de independência, invocação, rigor Feynman e camada adaptativa.
# Garante que a edição MarceloClaro não sincronize com upstream,
# preserva lockstep user/model-invoked, metadados OpenAI, transporte pelo installer
# e invariantes das bridges MCI/ACME.

on:
  push:
    paths:
      - 'agents/**'
      - 'lib/integrations/adaptive/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'specs/SPEC-ADAPTIVE-MCI-ACME-BRIDGE.md'
      - 'scripts/verify-no-upstream-sync.py'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-installer-transport.mjs'
      - 'scripts/test-adaptive-bridges.mjs'
      - 'lib/commands/update.js'
      - 'package.json'
      - 'INDEPENDENCE.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'agents/**'
      - 'lib/integrations/adaptive/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'specs/SPEC-ADAPTIVE-MCI-ACME-BRIDGE.md'
      - 'scripts/verify-no-upstream-sync.py'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-installer-transport.mjs'
      - 'scripts/test-adaptive-bridges.mjs'
      - 'lib/commands/update.js'
      - 'package.json'
      - 'INDEPENDENCE.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar independência de upstream
        run: python3 scripts/verify-no-upstream-sync.py
      - name: Verificar eixo de invocação
        run: python3 scripts/verify-invocation.py
      - name: Verificar Feynman Evidence & Understanding Layer
        run: python3 scripts/verify-feynman-layer.py
      - name: Smoke test de transporte do installer
        run: node scripts/test-installer-transport.mjs
      - name: Verificar bridges adaptativas MCI e ACME
        run: node scripts/test-adaptive-bridges.mjs
