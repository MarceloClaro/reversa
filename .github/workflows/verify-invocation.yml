name: Verify invocation axis

# Gates executáveis de independência, invocação, rigor Feynman, camadas adaptativas,
# Hermes Evidence Governance e Software Engineering Intelligence v5.

on:
  push:
    paths:
      - 'agents/**'
      - 'lib/integrations/adaptive/**'
      - 'lib/integrations/hermes/**'
      - 'lib/integrations/software-engineering/**'
      - 'schemas/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'specs/SPEC-ADAPTIVE-*.md'
      - 'specs/SPEC-HERMES-*.md'
      - 'specs/SPEC-SOFTWARE-ENGINEERING-INTELLIGENCE-V5.md'
      - 'scripts/verify-no-upstream-sync.py'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-*.mjs'
      - 'lib/commands/update.js'
      - 'package.json'
      - 'INDEPENDENCE.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'agents/**'
      - 'lib/integrations/adaptive/**'
      - 'lib/integrations/hermes/**'
      - 'lib/integrations/software-engineering/**'
      - 'schemas/**'
      - 'specs/SPEC-FEYNMAN-EVIDENCE-UNDERSTANDING-LAYER.md'
      - 'specs/SPEC-ADAPTIVE-*.md'
      - 'specs/SPEC-HERMES-*.md'
      - 'specs/SPEC-SOFTWARE-ENGINEERING-INTELLIGENCE-V5.md'
      - 'scripts/verify-no-upstream-sync.py'
      - 'scripts/verify-invocation.py'
      - 'scripts/verify-feynman-layer.py'
      - 'scripts/test-*.mjs'
      - 'lib/commands/update.js'
      - 'package.json'
      - 'INDEPENDENCE.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar independência de upstream
        run: python3 scripts/verify-no-upstream-sync.py
      - name: Verificar eixo de invocação
        run: python3 scripts/verify-invocation.py
      - name: Verificar Feynman Evidence & Understanding Layer
        run: python3 scripts/verify-feynman-layer.py
      - name: Smoke test de transporte do installer
        run: node scripts/test-installer-transport.mjs
      - name: Verificar Adaptive MCI/ACME Governance v2
        run: node scripts/test-adaptive-bridges.mjs
      - name: Verificar Offline Policy Evaluation v3
        run: node scripts/test-offline-policy-evaluation.mjs
      - name: Verificar Hermes Bridge v1
        run: node scripts/test-hermes-bridge.mjs
      - name: Verificar opcionalidade Hermes
        run: node scripts/test-hermes-optionality.mjs
      - name: Verificar Hermes Evidence Governor v2
        run: node scripts/test-hermes-evidence-governor.mjs
      - name: Verificar Software Engineering Intelligence v5
        run: node scripts/test-software-engineering-intelligence-v5.mjs
